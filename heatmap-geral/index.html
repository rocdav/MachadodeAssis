<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatmap geral — Machado de Assis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../_shared/mobile-map.css" />
    <link rel="stylesheet" href="../_shared/fullscreen.css" />
    <link rel="stylesheet" href="../_shared/combo-select.css" />
    <link rel="stylesheet" href="../_shared/detail-panel.css" />
    <link rel="stylesheet" href="../_shared/topnav.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>Heatmap geral</h2>
                <p class="subtitle">Densidade de menções a locais no conjunto da obra de Machado.</p>
                <div class="filter-row">
                    <label for="regionSelect">Região:</label>
                    <select id="regionSelect">
                        <option value="all">Todas</option>
                        <option value="rio">Rio de Janeiro</option>
                        <option value="brasil">Brasil (fora do Rio)</option>
                        <option value="estrangeiro">Estrangeiro</option>
                    </select>
                </div>
                <div id="stats" class="stats">Carregando…</div>
                <div class="legend">
                    <div class="legend-title">Intensidade</div>
                    <div class="legend-bar"></div>
                    <div class="legend-labels">
                        <span>menos</span><span>mais</span>
                    </div>
                </div>
                <div class="hint">
                    Os pontos são ponderados pelo número de citações.
                    Use o seletor de região para focar em Rio, Brasil ou estrangeiro.
                </div>
            </header>
            <ul class="results" id="results"></ul>
        </aside>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="../_shared/leaflet-popup.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/mobile-map.js" defer></script>
    <script src="../_shared/sidebar-toggle.js" defer></script>
    <script src="../_shared/fullscreen.js" defer></script>
    <script src="../_shared/combo-select.js" defer></script>
    <script src="../_shared/detail-panel.js" defer></script>
    <script src="../_shared/topnav.js" defer></script>
</body>
</html>
