<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo de relações por local — Machado de Assis</title>
    <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../_shared/fullscreen.css" />
    <link rel="stylesheet" href="../_shared/topnav.css" />
</head>
<body>
    <div class="layout">
        <header class="topbar">
            <h2>Grafo de relações por local</h2>
            <div class="controls">
                <label for="placeSelector">Local:</label>
                <select id="placeSelector"><option>Carregando…</option></select>
            </div>
        </header>
        <div class="content">
            <div id="graph"></div>
            <aside id="details">
                <p class="hint"><em>Selecione um local para ver o grafo das obras de Machado de Assis que o citam.</em></p>
            </aside>
        </div>
    </div>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/fullscreen.js" defer></script>
    <script src="../_shared/topnav.js" defer></script>
</body>
</html>
