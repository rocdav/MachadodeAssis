<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca textual nas citações — Machado de Assis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../_shared/mobile-map.css" />
    <link rel="stylesheet" href="../_shared/fullscreen.css" />
    <link rel="stylesheet" href="../_shared/combo-select.css" />
    <link rel="stylesheet" href="../_shared/detail-panel.css" />
    <link rel="stylesheet" href="../_shared/topnav.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>Buscar nas citações</h2>
                <p class="subtitle">Encontre lugares onde Machado de Assis menciona uma palavra ou expressão.</p>
                <div class="search-box">
                    <input type="search" id="search" placeholder="ex.: janela, morte, cigarro, trem…" autocomplete="off" autofocus />
                </div>
                <div class="examples">
                    Exemplos:
                    <a href="#" class="suggest" data-q="janela">janela</a>
                    <a href="#" class="suggest" data-q="morte">morte</a>
                    <a href="#" class="suggest" data-q="cigarro">cigarro</a>
                    <a href="#" class="suggest" data-q="trem">trem</a>
                    <a href="#" class="suggest" data-q="café">café</a>
                    <a href="#" class="suggest" data-q="amor">amor</a>
                </div>
                <div id="stats" class="stats">Digite acima para começar.</div>
            </header>
            <ul class="results" id="results"></ul>
        </aside>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="../_shared/leaflet-popup.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/mobile-map.js" defer></script>
    <script src="../_shared/sidebar-toggle.js" defer></script>
    <script src="../_shared/fullscreen.js" defer></script>
    <script src="../_shared/combo-select.js" defer></script>
    <script src="../_shared/detail-panel.js" defer></script>
    <script src="../_shared/topnav.js" defer></script>
</body>
</html>
