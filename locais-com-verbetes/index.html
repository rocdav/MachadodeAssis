<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locais citados com verbetes — Machado de Assis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../_shared/mobile-map.css" />
    <link rel="stylesheet" href="../_shared/fullscreen.css" />
    <link rel="stylesheet" href="../_shared/combo-select.css" />
    <link rel="stylesheet" href="../_shared/detail-panel.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>Locais com verbetes</h2>
                <p class="subtitle">Todos os lugares citados na obra de Machado, com verbete e citações.</p>
                <div class="search-box">
                    <input type="search" id="search" placeholder="Buscar por nome do lugar…" autocomplete="off" />
                </div>
                <div class="filter-row">
                    <label for="regionSelect">Região:</label>
                    <select id="regionSelect">
                        <option value="all">Todas</option>
                        <option value="rio">Rio de Janeiro</option>
                        <option value="brasil">Brasil (fora do Rio)</option>
                        <option value="estrangeiro">Estrangeiro</option>
                    </select>
                </div>
                <div class="filter-row">
                    <label for="classSelect">Tipo:</label>
                    <select id="classSelect">
                        <option value="all">Todos</option>
                    </select>
                </div>
                <div id="stats" class="stats">Carregando…</div>
            </header>
            <ul class="results" id="results"></ul>
        </aside>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="../_shared/leaflet-popup.js"></script>
    <script src="script.js"></script>
    <script src="../_shared/mobile-map.js" defer></script>
    <script src="../_shared/sidebar-toggle.js" defer></script>
    <script src="../_shared/fullscreen.js" defer></script>
    <script src="../_shared/combo-select.js" defer></script>
    <script src="../_shared/detail-panel.js" defer></script>
</body>
</html>
